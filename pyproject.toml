[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betty-better-eater"
version = "0.3.0"
description = "Find healthier groceries at your own store: Yuka-style score estimates from open data (Open Food Facts)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.scripts]
betty = "betty.cli:main"

[tool.setuptools]
packages = ["betty"]

[tool.setuptools.package-data]
betty = ["data/*.json"]
